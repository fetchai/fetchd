name: Build and push images
on:
  push:
    tags:
      # Run for every tag push EXCEPT the v0.15.1 release tag (that release's
      # images are built/pushed manually via
      # build-production-image-with-push-and-pull.sh).
      # Tag patterns are anchored full-string matches, so 'v0.15.1' matches
      # ONLY the exact tag (v0.15.1-rc0 etc. still trigger this workflow).
      # NOTE: for future releases, extend the negated pattern (e.g. a
      # '!v[0-9]*.[0-9]*.[0-9]*' pattern would exclude ALL plain semver
      # release tags, but also any tag with a suffix like -rc0).
      - '!v0.15.1'
      - '*'

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2

      - name: Login to Docker Hub
        run: |
          docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Publish Public Images
        uses: ejfitzgerald/action-docker-tag@v0.2.0-alpha2
        with:
          repo: fetchai/fetchd
          target: hub

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v0
        with:
          service_account_key: ${{ secrets.GCLOUD_KEY_IMAGES }}

      - name: Login to GCR Registry
        run: |
          gcloud auth configure-docker

      - name: Build and Publish Private Images
        uses: ejfitzgerald/action-docker-tag@v0.2.0-alpha2
        with:
          repo: gcr.io/fetch-ai-images/fetchd
          target: gcr
